name: CI - Billing Service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu

      - name: Install SonarScanner
        run: dotnet tool update dotnet-sonarscanner --tool-path "$RUNNER_TEMP/sonar"

      - name: Restore
        run: dotnet restore Tests/BillingService.Tests/BillingService.Tests.csproj

      - name: Begin SonarCloud analysis
        run: '"$RUNNER_TEMP/sonar/dotnet-sonarscanner" begin /k:"Venomouus_oficina-billing-service" /o:"venomouus" /d:sonar.token="$SONAR_TOKEN" /d:sonar.cs.opencover.reportsPaths="Tests/BillingService.Tests/TestResults/**/coverage.opencover.xml" /d:sonar.qualitygate.wait=true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build
        run: dotnet build Tests/BillingService.Tests/BillingService.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: pwsh -File Tests/BillingService.Tests/run-coverage.ps1

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: billing-service-coverage
          path: Tests/BillingService.Tests/TestResults/**/coverage.cobertura.xml

      - name: End SonarCloud analysis
        if: always()
        run: '"$RUNNER_TEMP/sonar/dotnet-sonarscanner" end /d:sonar.token="$SONAR_TOKEN"'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Docker build
        run: docker build --tag oficina-billing-service:${{ github.sha }} .

  publish-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test-analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::639793186952:role/oficina-fase4-lab-github-deploy
          aws-region: sa-east-1
          allowed-account-ids: '639793186952'
      - uses: azure/setup-kubectl@v4
      - name: Build and push immutable image
        run: |
          IMAGE=639793186952.dkr.ecr.sa-east-1.amazonaws.com/oficina-fase4-lab/billing-service:${{ github.sha }}
          if ! aws ecr describe-images --repository-name oficina-fase4-lab/billing-service --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            aws ecr get-login-password --region sa-east-1 | docker login --username AWS --password-stdin 639793186952.dkr.ecr.sa-east-1.amazonaws.com
            docker build -t "$IMAGE" .
            docker push "$IMAGE"
          fi
      - name: Deploy to Kubernetes
        run: |
          aws eks update-kubeconfig --name oficina-fase4-lab --region sa-east-1
          IMAGE=639793186952.dkr.ecr.sa-east-1.amazonaws.com/oficina-fase4-lab/billing-service:${{ github.sha }}
          sed "s#ghcr.io/venomouus/oficina-billing-service:latest#$IMAGE#" k8s/deployment.yaml | kubectl -n oficina apply -f -
          kubectl -n oficina rollout status deployment/billing-service --timeout=180s
