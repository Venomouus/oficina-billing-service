apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: oficina
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      automountServiceAccountToken: false
      containers:
        - name: billing-service
          image: ghcr.io/venomouus/oficina-billing-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: observability-config
                  key: otlp-endpoint
                  optional: true
            - name: Mongo__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: billing-service-secrets
                  key: database-connection
            - name: Mongo__Database
              value: oficina_billing
            - name: RabbitMq__Host
              value: rabbitmq
            - name: RabbitMq__Port
              value: "5672"
            - name: RabbitMq__User
              valueFrom:
                secretKeyRef:
                  name: messaging-secrets
                  key: username
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: messaging-secrets
                  key: password
            - name: MercadoPago__AccessToken
              valueFrom:
                secretKeyRef:
                  name: mercado-pago-secrets
                  key: access-token
            - name: MercadoPago__ExternalPosId
              valueFrom:
                secretKeyRef:
                  name: mercado-pago-secrets
                  key: external-pos-id
            - name: MercadoPago__WebhookUrl
              valueFrom:
                secretKeyRef:
                  name: mercado-pago-secrets
                  key: webhook-url
            - name: MercadoPago__WebhookSecret
              valueFrom:
                secretKeyRef:
                  name: mercado-pago-secrets
                  key: webhook-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: oficina
spec:
  selector:
    app: billing-service
  ports:
    - port: 8082
      targetPort: 8080
  type: ClusterIP
